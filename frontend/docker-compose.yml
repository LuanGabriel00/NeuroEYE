services:
  # Default creds below are fine for local/dev use. For a real deployment,
  # override POSTGRES_PASSWORD and the DATABASE_URL below (e.g. via an
  # untracked .env file) and consider dropping the host port mapping —
  # `app` and `migrate` reach this over the compose network either way.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuroeye
      POSTGRES_PASSWORD: neuroeye
      POSTGRES_DB: neuroeye
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroeye"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies pending migrations, then exits. `app` waits for it.
  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://neuroeye:neuroeye@db:5432/neuroeye?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://neuroeye:neuroeye@db:5432/neuroeye?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your environment or an .env file}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
